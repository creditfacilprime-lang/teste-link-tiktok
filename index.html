
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Link</title>
  <style>
    body {
      background: #080d0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }
    .card {
      max-width: 420px;
      margin: auto;
      background: #142019;
      padding: 30px;

    a {
      display: block;
      background: #20c878;

      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TESTE DE ACESSO</h1>
    <p>Estamos testando nossa própria página externa.</p>
    <p>Se você chegou até aqui, o link abriu corretamente.</p>
    <a href="https://www.google.com" target="_blank">
      TESTAR LINK EXTERNO
    </a>
  </div>
</body>
</html>
